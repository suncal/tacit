<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>overlays</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Schibsted+Grotesk:wght@600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:"Geist",system-ui,sans-serif}
/* The product frame: everything outside the window is painted (dark brand background), the window interior is transparent
   so the console recording shows through underneath. */
#frame{position:absolute;inset:0;background:transparent}
/* the backdrop is masked so the window interior (below its title bar, bottom corners rounded) is truly transparent */
#frame .paint,#frame .grid{position:absolute;inset:0;-webkit-mask-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080'%3E%3Cpath fill-rule='evenodd' fill='black' d='M0 0H1920V1080H0Z M110 117.6 H1810 V1029.6 a22 22 0 0 1 -22 22 H132 a22 22 0 0 1 -22 -22 Z'/%3E%3C/svg%3E");-webkit-mask-size:1920px 1080px;-webkit-mask-repeat:no-repeat;mask-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080'%3E%3Cpath fill-rule='evenodd' fill='black' d='M0 0H1920V1080H0Z M110 117.6 H1810 V1029.6 a22 22 0 0 1 -22 22 H132 a22 22 0 0 1 -22 -22 Z'/%3E%3C/svg%3E");mask-size:1920px 1080px;mask-repeat:no-repeat}
#frame .paint{background:radial-gradient(1400px 800px at 25% 15%,#141817 0%,#0A0B0B 60%)}
#frame .grid{background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:80px 80px}
#frame .glow{position:absolute;left:50%;top:52%;width:1700px;height:980px;transform:translate(-50%,-50%);border-radius:40px;box-shadow:0 60px 160px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08),0 0 120px rgba(63,191,164,.10)}
#frame .win{position:absolute;left:50%;top:52%;width:1700px;height:980px;transform:translate(-50%,-50%);border-radius:22px;overflow:hidden;background:transparent}
#frame .bar{height:46px;background:#0F1211;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;padding:0 18px;gap:10px;font-family:"Geist Mono",monospace;font-size:16px;color:#86867F}
#frame .bar i{width:12px;height:12px;border-radius:50%;background:#2b2f2e;display:inline-block}
#frame .bar i:nth-child(1){background:#E0776C}#frame .bar i:nth-child(2){background:#D9A441}#frame .bar i:nth-child(3){background:#4FBE86}
#frame .bar b{color:#EDEDEA;font-weight:500;margin-left:14px}
#frame .hole{position:absolute;left:0;top:46px;right:0;bottom:0;background:transparent}
.brand{position:absolute;top:34px;left:60px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:22px;color:#BFBFBA;letter-spacing:.02em}
.mark{width:28px;height:28px;position:relative}.mark i{position:absolute;inset:0;border-radius:8px;background:#3FBFA4;opacity:.35;transform:translate(-5px,-5px)}.mark b{position:absolute;inset:0;border-radius:8px;background:#3FBFA4;display:flex;align-items:center;justify-content:center;color:#062A24;font-size:18px}
.chapter{position:absolute;top:30px;right:60px;font-family:"Geist Mono",monospace;font-size:18px;color:#86867F;border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:10px 18px;letter-spacing:.08em;text-transform:uppercase;background:rgba(10,11,11,.6)}.chapter b{color:#3FBFA4;font-weight:500;margin-right:10px}
/* lower-third callout */
#callout{position:absolute;left:110px;bottom:70px;display:flex;align-items:center;gap:18px;background:rgba(10,11,11,.86);border:1px solid rgba(63,191,164,.45);border-left:6px solid #3FBFA4;border-radius:16px;padding:20px 30px 20px 26px;box-shadow:0 20px 60px rgba(0,0,0,.5);backdrop-filter:blur(8px)}
#callout .k{font-family:"Geist Mono",monospace;font-size:18px;color:#3FBFA4;letter-spacing:.1em;text-transform:uppercase}
#callout .t{font-family:"Schibsted Grotesk",sans-serif;font-weight:600;font-size:34px;color:#EDEDEA;letter-spacing:-.01em;line-height:1.2}
</style></head><body>
<script>
const q = new URLSearchParams(location.search);
if (q.get("kind") === "frame") {
  document.body.innerHTML = `<div id="frame"><div class="paint"></div><div class="grid"></div><div class="glow"></div><div class="win"><div class="bar"><i></i><i></i><i></i><b>${q.get("title") || "Tacit console"}</b><span style="margin-left:auto">${q.get("url") || "127.0.0.1:4800"}</span></div><div class="hole"></div></div>
  <div class="brand"><span class="mark"><i></i><b>✓</b></span>TACIT</div>${q.get("chapter") ? `<div class="chapter"><b>${q.get("chapter").split("|")[0]}</b>${q.get("chapter").split("|")[1]}</div>` : ""}</div>`;
} else {
  document.body.innerHTML = `<div id="callout"><div><div class="k">${q.get("k") || "live"}</div><div class="t">${q.get("t") || ""}</div></div></div>`;
}
</script>
</body></html>
