[project]
name = "tacit"
version = "0.1.0"
description = "Tacit — the AI teammate that learns your job by watching, proves it can do it, then asks to take over."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.13",
  "pydantic[email]>=2.7", "pydantic-settings>=2.3", "httpx>=0.27", "anthropic>=1.0", "itsdangerous>=2.2", "python-multipart>=0.0.9",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
[tool.pytest.ini_options]
testpaths = ["tests"]
